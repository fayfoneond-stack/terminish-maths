<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminish l'univers de Mathématiques by KODJO (NE +1)</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%); color:#e2e8f0; min-height:100vh; }
    header { text-align:center; padding:40px 20px 28px; background:linear-gradient(180deg,rgba(56,189,248,0.12) 0%,transparent 100%); }
    .subtitle { font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#38bdf8; margin-bottom:10px; }
    h1 { font-size:clamp(1.7rem,4vw,2.8rem); font-weight:800; margin:0; background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .byline { margin-top:10px; font-size:1.05rem; color:#94a3b8; }
    .badge { background:#38bdf8; color:#0f172a; padding:2px 10px; border-radius:12px; font-size:0.8rem; font-weight:700; }
    nav { display:flex; justify-content:center; gap:14px; padding:0 20px 24px; flex-wrap:wrap; }
    .main-btn { padding:12px 28px; border-radius:12px; border:none; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.3s; }
    .subnav { display:flex; justify-content:center; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
    .sub-btn { padding:10px 22px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); color:#94a3b8; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .sub-btn.active { font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; max-width:1200px; margin:0 auto; padding:0 20px; }
    .card { background:rgba(255,255,255,0.03); border-radius:18px; padding:24px; }
    .card-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .card-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:#fff; }
    .card h4 { margin:0; color:#e2e8f0; }
    .link-list { display:flex; flex-direction:column; gap:8px; }
    .link-list a { text-decoration:none; color:#94a3b8; padding:10px 14px; border-radius:8px; display:flex; align-items:center; gap:8px; transition:all 0.2s; }
    .link-list a:hover { color:#e2e8f0; }
    footer { text-align:center; padding:32px 20px; color:#475569; font-size:0.9rem; border-top:1px solid rgba(255,255,255,0.05); margin-top:24px; }
    .hidden { display:none; }
  </style>
</head>
<body>

<header>
  <div class="subtitle">Plateforme Éducative</div>
  <h1>Terminish l'univers de Mathématiques</h1>
  <div class="byline">by <strong style="color:#38bdf8;">KODJO</strong> <span class="badge">NE +1</span></div>
</header>

<nav>
  <button class="main-btn" id="btn-sec1" onclick="showMain('sec1')" style="background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 4px 18px rgba(56,189,248,0.3);">📘 Secondaire 1</button>
  <button class="main-btn" id="btn-sec2" onclick="showMain('sec2')" style="background:rgba(255,255,255,0.07);color:#94a3b8;">📗 Secondaire 2</button>
</nav>

<section id="sec1">
  <div class="subnav" id="subnav-sec1"></div>
  <div id="content-sec1"></div>
</section>

<section id="sec2" class="hidden">
  <div class="subnav" id="subnav-sec2"></div>
  <div id="content-sec2"></div>
</section>

<footer>
  <p>© 2026 <strong style="color:#38bdf8;">Terminish l'univers de Mathématiques</strong> — by <strong>KODJO</strong> <span class="badge">NE +1</span></p>
  <p style="margin-top:8px;font-size:0.8rem;color:#334155;">Tous droits réservés. Plateforme éducative dédiée aux mathématiques.</p>
</footer>

<script>
const data = {
  sec1: {
    classes: [
      {id:'6e', name:'6ème', color:'#38bdf8', grad:'linear-gradient(135deg,#38bdf8,#0284c7)'},
      {id:'5e', name:'5ème', color:'#818cf8', grad:'linear-gradient(135deg,#818cf8,#6366f1)'},
      {id:'4e', name:'4ème', color:'#c084fc', grad:'linear-gradient(135deg,#c084fc,#a855f7)'},
      {id:'3e', name:'3ème', color:'#f472b6', grad:'linear-gradient(135deg,#f472b6,#db2777)'}
    ],
    periods: [
      {num:'1️⃣', name:'Trimestre 1', b:'rgba(56,189,248,0.15)', bg:'rgba(56,189,248,0.05)', h:'rgba(56,189,248,0.12)'},
      {num:'2️⃣', name:'Trimestre 2', b:'rgba(129,140,248,0.15)', bg:'rgba(129,140,248,0.05)', h:'rgba(129,140,248,0.12)'},
      {num:'3️⃣', name:'Trimestre 3', b:'rgba(192,132,252,0.15)', bg:'rgba(192,132,252,0.05)', h:'rgba(192,132,252,0.12)'}
    ]
  },
  sec2: {
    classes: [
      {id:'2nda', name:'2nde A', color:'#34d399', grad:'linear-gradient(135deg,#34d399,#059669)'},
      {id:'2nds', name:'2nde S', color:'#2dd4bf', grad:'linear-gradient(135deg,#2dd4bf,#0d9488)'},
      {id:'1era', name:'1ère A', color:'#f472b6', grad:'linear-gradient(135deg,#f472b6,#db2777)'},
      {id:'1erd', name:'1ère D', color:'#fb923c', grad:'linear-gradient(135deg,#fb923c,#ea580c)'},
      {id:'1erc', name:'1ère C', color:'#a78bfa', grad:'linear-gradient(135deg,#a78bfa,#7c3aed)'},
      {id:'tlea', name:'Tle A', color:'#fbbf24', grad:'linear-gradient(135deg,#fbbf24,#d97706)'},
      {id:'tled', name:'Tle D', color:'#f87171', grad:'linear-gradient(135deg,#f87171,#dc2626)'},
      {id:'tlec', name:'Tle C', color:'#60a5fa', grad:'linear-gradient(135deg,#60a5fa,#2563eb)'}
    ],
    periods: [
      {num:'☝️', name:'Semestre 1', b:'rgba(52,211,153,0.15)', bg:'rgba(52,211,153,0.05)', h:'rgba(52,211,153,0.12)'},
      {num:'✌️', name:'Semestre 2', b:'rgba(251,191,36,0.15)', bg:'rgba(251,191,36,0.05)', h:'rgba(251,191,36,0.12)'}
    ]
  }
};
const links = ['📖 Cours','✏️ Exercices','📝 Devoirs','📊 Composition','🎓 Examen'];

function buildSubnav(sec, aid) {
  const c = document.getElementById('subnav-'+sec), d = data[sec];
  c.innerHTML = d.classes.map(cl => {
    const a = cl.id === aid;
    return `<button class="sub-btn ${a?'active':''}" onclick="showSub('${sec}','${cl.id}')" style="border-color:${a?cl.color+'80':'rgba(255,255,255,0.08)'};background:${a?cl.color+'20':'rgba(255,255,255,0.04)'};color:${a?cl.color:'#94a3b8'};">${cl.name}</button>`;
  }).join('');
}
function buildContent(sec, cid) {
  const c = document.getElementById('content-'+sec), d = data[sec], cl = d.classes.find(x=>x.id===cid);
  c.innerHTML = `<div style="text-align:center;margin-bottom:24px;"><h3 style="color:${cl.color};margin:0;font-size:1.3rem;">${sec==='sec1'?'📘':'📗'} ${cl.name} — ${d.periods.length===3?'Trois Trimestres':'Deux Semestres'}</h3></div>
  <div class="grid">${d.periods.map(p=>`<div class="card" style="border:1px solid ${p.b};">
    <div class="card-header"><div class="card-icon" style="background:${cl.grad};">${p.num}</div><h4>${p.name}</h4></div>
    <div class="link-list">${links.map(l=>`<a href="#" style="background:${p.bg};border:1px solid ${p.b};" onmouseover="this.style.background='${p.h}';this.style.color='#e2e8f0'" onmouseout="this.style.background='${p.bg}';this.style.color='#94a3b8'"><span>${l.split(' ')[0]}</span> ${l.split(' ')[1]}</a>`).join('')}</div>
  </div>`).join('')}</div>`;
}
function showMain(sec) {
  document.getElementById('sec1').classList.toggle('hidden', sec!=='sec1');
  document.getElementById('sec2').classList.toggle('hidden', sec!=='sec2');
  const a = sec==='sec1';
  document.getElementById('btn-sec1').style.cssText = a ? 'background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 4px 18px rgba(56,189,248,0.3);' : 'background:rgba(255,255,255,0.07);color:#94a3b8;box-shadow:none;';
  document.getElementById('btn-sec2').style.cssText = !a ? 'background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 4px 18px rgba(52,211,153,0.3);' : 'background:rgba(255,255,255,0.07);color:#94a3b8;box-shadow:none;';
}
function showSub(sec, id) { buildSubnav(sec, id); buildContent(sec, id); }

buildSubnav('sec1','6e'); buildContent('sec1','6e');
buildSubnav('sec2','2nda'); buildContent('sec2','2nda');
</script>

</body>
</html>
