# Nginx — exemple de reverse proxy derrière HTTPS (Certbot)
# Remplacer ecole.votre-domaine.tg par votre domaine, puis :
#   sudo certbot --nginx -d ecole.votre-domaine.tg

server {
    listen 80;
    listen [::]:80;
    server_name ecole.votre-domaine.tg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecole.votre-domaine.tg;

    # Certificats gérés par Certbot
    ssl_certificate     /etc/letsencrypt/live/ecole.votre-domaine.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecole.votre-domaine.tg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 8m;          # logos en data URL et imports d'élèves
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
